[package]
name = "skua"
# The version shown in the UI title bar and by --version. Bump when releasing.
version = "1.0.0"
edition = "2024"
description = "Local AWS SSM connection tool: interactive inventory browser + iTerm2-like multiplexing/broadcast"
license = "MIT"
repository = "https://github.com/siansiansu/skua"
homepage = "https://siansiansu.github.io/skua/"
readme = "README.md"
keywords = ["aws", "ssm", "tui", "session-manager", "terminal"]
categories = ["command-line-utilities"]

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
aws-config = { version = "1.8.13", features = ["behavior-version-latest"] }
aws-sdk-ec2 = "1.208.0"
aws-sdk-ssm = "1.103.0"
aws-sdk-sts = "1.97.0"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
humantime = "2.4.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "time"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"
