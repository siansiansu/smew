[package]
name = "smew"
# The version shown in the UI title bar and by --version. Bump when releasing.
version = "1.1.0"
edition = "2024"
# Verified with `cargo +1.88 check --all-targets` (edition 2024 needs ≥1.85;
# the AWS SDK / ratatui declare 1.88).
rust-version = "1.88"
# Whitelist of what ships to crates.io. skins/ and config.example.yaml are
# include_str!-ed (src/theme.rs, the config test), so they must stay.
include = [
    "/src/**",
    "/build.rs",
    "/skins/*.yaml",
    "/config.example.yaml",
    "/completions/**",
    "/README.md",
    "/LICENSE",
]
description = "Terminal UI to explore AWS resources — EC2, S3, Lambda, RDS and more — and shell in over SSM with split panes and broadcast; no bastion, no port 22"
license = "MIT"
repository = "https://github.com/siansiansu/smew"
homepage = "https://siansiansu.github.io/smew/"
readme = "README.md"
keywords = ["aws", "ssm", "tui", "session-manager", "terminal"]
categories = ["command-line-utilities"]

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dependencies]
aws-config = { version = "1.8.13", features = ["behavior-version-latest"] }
aws-sdk-autoscaling = "1.108.0"
aws-sdk-cloudformation = "1.106.0"
aws-sdk-cloudwatch = "1.102.0"
aws-sdk-dynamodb = "1.104.0"
aws-sdk-ec2 = "1.208.0"
aws-sdk-ec2instanceconnect = "1.93.0"
aws-sdk-ecs = "1.111.0"
aws-sdk-eks = "1.122.0"
aws-sdk-elasticloadbalancingv2 = "1.106.0"
aws-sdk-lambda = "1.115.0"
aws-sdk-rds = "1.125.0"
aws-sdk-s3 = "1.122.0"
aws-sdk-sns = "1.94.0"
aws-sdk-sqs = "1.93.0"
aws-sdk-ssm = "1.103.0"
aws-sdk-sts = "1.97.0"
chrono = "0.4.45"
clap = { version = "4.6.5", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
humantime = "2.4.0"
portable-pty = "0.9.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml_ng = "0.10.0"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "time"] }
unicode-width = "0.2.2"
vt100 = "0.16.2"
